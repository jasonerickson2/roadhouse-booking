<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Roadhouse Twin Lakes - Book Direct | Colorado Lodging</title>
    <meta name="description" content="Book direct at the Roadhouse in Twin Lakes, Colorado. At 9,222 feet, your base camp for skiing, hiking, fishing, and mountain adventures. Coffee, soft serve, and lodging." />
    <meta name="keywords" content="Twin Lakes Colorado, lodging, vacation rental, Leadville, ski, hike, fish, coffee shop, direct booking" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://roadhouse.milehigh.systems/" />

    <!-- Social Media Tags -->
    <meta property="og:title" content="Roadhouse Twin Lakes - Book Direct" />
    <meta property="og:description" content="Book direct at the Roadhouse in Twin Lakes, Colorado. Your base camp for mountain adventures." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roadhouse.milehigh.systems/" />



    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Square Payment SDK -->
    <script type="text/javascript" src="https://web.squarecdn.com/v1/square.js"></script>
    <!-- MileHigh Recover: finds abandoned bookings. Sends nothing until the visitor accepts the cookie notice. -->
    <script src="/recover.js" data-key="8cb0d0189727d3205a24c86c62f5d187" defer></script>
  </head>
  <body>
    <!-- MileHigh Recover notice (v0.3): slim strip at the top that pushes the page down.
         Most visitors: notice with Got it / No thanks. Pacific timezone: nothing is tracked until Okay. -->
    <div id="mhr-banner" hidden style="background:#0D2123;color:#F5F1E8;font:13px/1.4 Montserrat,system-ui,sans-serif;padding:9px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap">
      <span id="mhr-text"></span>
      <span style="display:flex;gap:8px">
        <button id="mhr-yes" style="background:#F5F1E8;color:#0D2123;border:0;padding:6px 14px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer"></button>
        <button id="mhr-no" style="background:transparent;color:#F5F1E8;border:1px solid rgba(245,241,232,.6);padding:6px 14px;border-radius:999px;font:inherit;cursor:pointer">No thanks</button>
      </span>
    </div>
    <script>
      (function(){var b=document.getElementById('mhr-banner');
        if(document.cookie.indexOf('mhr_banner=1')>-1){b.remove();return;}
        var optIn;try{optIn=/^America\/(Los_Angeles|Tijuana)$/.test(Intl.DateTimeFormat().resolvedOptions().timeZone);}catch(e){optIn=true;} // same rule as recover.js; that script is deferred and not loaded yet
        document.getElementById('mhr-text').innerHTML=optIn
          ?'May we use cookies to save your trip details and help you finish booking? <a href="/terms#cookies" style="color:inherit">Details</a>'
          :'We use cookies to save your trip details and help you finish booking. <a href="/terms#cookies" style="color:inherit">Details</a>';
        document.getElementById('mhr-yes').textContent=optIn?'Okay':'Got it';
        function done(){b.remove();document.cookie='mhr_banner=1; max-age=31536000; path=/; SameSite=Lax';}
        document.getElementById('mhr-yes').onclick=function(){if(optIn&&window.MHRecover)MHRecover.consent();done();};
        document.getElementById('mhr-no').onclick=function(){if(window.MHRecover)MHRecover.revoke();done();};
        b.hidden=false;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
