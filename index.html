<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Roadhouse Twin Lakes - Book Direct | Colorado Lodging</title>
    <meta name="description" content="Book direct at the Roadhouse in Twin Lakes, Colorado. At 9,222 feet, your base camp for skiing, hiking, fishing, and mountain adventures. Coffee, soft serve, and lodging." />
    <meta name="keywords" content="Twin Lakes Colorado, lodging, vacation rental, Leadville, ski, hike, fish, coffee shop, direct booking" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://roadhouse.milehigh.systems/" />

    <!-- Social Media Tags -->
    <meta property="og:title" content="Roadhouse Twin Lakes - Book Direct" />
    <meta property="og:description" content="Book direct at the Roadhouse in Twin Lakes, Colorado. Your base camp for mountain adventures." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roadhouse.milehigh.systems/" />



    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Square Payment SDK -->
    <script type="text/javascript" src="https://web.squarecdn.com/v1/square.js"></script>
    <!-- MileHigh Recover: finds abandoned bookings. Sends nothing until the visitor accepts the cookie notice. -->
    <script src="/recover.js" data-key="8cb0d0189727d3205a24c86c62f5d187" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- MileHigh Recover consent banner -->
    <div id="mhr-banner" style="position:fixed;bottom:0;left:0;right:0;background:#2b2118;color:#F5EDE4;padding:14px 20px;font:14px/1.4 Montserrat,system-ui,sans-serif;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:9999;box-shadow:0 -2px 12px rgba(0,0,0,.25)">
      <span>We use cookies to remember your booking and, with your okay, to check in if you don't finish it.</span>
      <button onclick="window.MHRecover&&MHRecover.consent();document.getElementById('mhr-banner').remove();document.cookie='mhr_banner=1; max-age=31536000; path=/'" style="background:#F5EDE4;color:#2b2118;border:0;padding:9px 16px;border-radius:6px;font-weight:700;cursor:pointer">Okay</button>
      <button onclick="window.MHRecover&&MHRecover.revoke();document.getElementById('mhr-banner').remove();document.cookie='mhr_banner=1; max-age=31536000; path=/'" style="background:transparent;color:#F5EDE4;border:1px solid #F5EDE4;padding:9px 16px;border-radius:6px;cursor:pointer">No thanks</button>
    </div>
    <script>
      (function(){var b=document.getElementById('mhr-banner');if(!b)return;
        if(document.cookie.indexOf('mhr_banner=1')>-1){b.remove();return;}
        // Keep the notice out of the way of the date picker and the payment form.
        var obs=new MutationObserver(function(){var busy=document.querySelector('.cal.open, #card-container, .sq-card-wrapper');b.style.display=busy?'none':'';});
        obs.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
      })();
    </script>
  </body>
</html>
