[build]
  publish = "out"
  command = "npm ci --legacy-peer-deps && npm run build"

# Apple Pay domain verification. Square keeps this file current; proxy it under our /.well-known path.
# Must come BEFORE the SPA catch-all so it is not rewritten to index.html.
[[redirects]]
  from = "/.well-known/apple-developer-merchantid-domain-association"
  to = "https://app.squareup.com/digital-wallets/apple-pay/apple-developer-merchantid-domain-association"
  status = 200
  force = true

# Old flow URLs (pre v6) go home.
[[redirects]]
  from = "/payment"
  to = "/"
  status = 301
[[redirects]]
  from = "/square-payment"
  to = "/"
  status = 301
[[redirects]]
  from = "/payment-pending"
  to = "/"
  status = 301
[[redirects]]
  from = "/confirmation"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. CSP ships as Report-Only for the first live week so a wallet host we missed
# cannot break checkout; flip the header name to Content-Security-Policy once a real Apple Pay,
# Google Pay, Cash App Pay and card payment have each gone through with no reports.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://web.squarecdn.com\" \"https://pay.google.com\"), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; script-src 'self' https://web.squarecdn.com https://*.squarecdn.com https://js.squareup.com https://pay.google.com https://kit.cash.app https://applepay.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://web.squarecdn.com https://*.squarecdn.com; font-src 'self' data: https://fonts.gstatic.com https://square-fonts-production-f.squarecdn.com https://d1g145x70srn7h.cloudfront.net; img-src 'self' data: blob: https:; frame-src 'self' https://web.squarecdn.com https://*.squarecdn.com https://*.squareup.com https://pay.google.com https://*.cash.app https://www.google.com https://maps.google.com; connect-src 'self' https://txbebwaxaqvxxjcmftjt.supabase.co https://pci-connect.squareup.com https://pci-connect.squareupsandbox.com https://*.squarecdn.com https://*.squareup.com https://o160250.ingest.sentry.io https://pay.google.com https://www.google.com https://google.com https://*.cash.app https://applepay.cdn-apple.com; worker-src 'self' blob:; manifest-src 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
